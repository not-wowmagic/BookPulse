<svg width="600" height="900" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Son of a Dead 1980s Bold Star</title>
  <desc id="desc">Neo-brutalist fallback cover art</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#2a0f0c" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.25" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)" />
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#f5f3ee" stroke-width="6" />

  <g filter="url(#grain)">
    <rect width="600" height="900" fill="#ffffff" opacity="0.22" />
  </g>

  <g fill="#f5f3ee" font-family="IBM Plex Mono, Space Mono, monospace" text-anchor="middle">
    <text x="300" y="300" font-size="38" font-weight="700" letter-spacing="1.4">SON OF A DEAD</text>
    <text x="300" y="380" font-size="70" font-weight="700" letter-spacing="1.8">1980S</text>
    <text x="300" y="455" font-size="44" font-weight="700" letter-spacing="1.5">BOLD STAR</text>
  </g>

  <g transform="translate(370 110) rotate(-6)">
    <rect width="190" height="42" fill="#e63b2e" stroke="#f5f3ee" stroke-width="2" />
    <text x="95" y="28" text-anchor="middle" fill="#f5f3ee" font-family="IBM Plex Mono, Space Mono, monospace" font-size="16" font-weight="700">VERIFIED COVER</text>
  </g>

  <text x="300" y="835" text-anchor="middle" fill="#bdbab4" font-family="IBM Plex Mono, Space Mono, monospace" font-size="20" letter-spacing="1.3">CHUCK SMITH</text>
</svg>
