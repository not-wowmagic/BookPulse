<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO -->
    <title>BookPulse — Real-Time Book Trends from the Filipino Reading Pulse</title>
    <meta name="description" content="BookPulse aggregates real-time book trends from BookTokPH, r/phbookclub, and Goodreads. Philippines-first reading intelligence — updated every 60 seconds." />
    <meta name="author" content="BookPulse" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BookPulse — Filipino Book Trend Intelligence" />
    <meta property="og:description" content="Real-time book trends aggregated from BookTokPH, r/phbookclub, and Goodreads Philippines." />
    <meta property="og:locale" content="en_PH" />

    <!-- Security Headers (meta-based, server headers preferred in production) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Fonts: preconnect + swap for FOUT prevention -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Preconnect to cover image hosts -->
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link rel="preconnect" href="https://books.google.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
